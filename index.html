<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brilliant Public School - Online Result</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
}
.header{
  background:#075985;
  color:white;
  text-align:center;
  padding:25px 10px;
}
.header h1{margin:0;font-size:25px}
.header p{margin:8px 0 0}

.box{
  max-width:420px;
  margin:35px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 15px #0002;
}
label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}
select,input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin-top:7px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:8px;
  background:#075985;
  color:white;
  font-size:17px;
  font-weight:bold;
}
.result{
  display:none;
  margin-top:25px;
  border-top:2px solid #075985;
  padding-top:20px;
}
.result h2{text-align:center}
table{
  width:100%;
  border-collapse:collapse;
}
td,th{
  border:1px solid #ddd;
  padding:9px;
  text-align:center;
}
.total{
  margin-top:15px;
  font-size:17px;
  line-height:1.8;
}
.footer{
  text-align:center;
  color:#666;
  padding:20px;
}
</style>
</head>

<body>

<div class="header">
  <h1>BRILLIANT PUBLIC SCHOOL</h1>
  <p>ONLINE RESULT</p>
</div>

<div class="box">

  <h2 style="text-align:center;">Check Your Result</h2>

  <label>Select Class</label>
  <select id="class">
    <option value="">Select Class</option>
    <option>Class 1</option>
    <option>Class 2</option>
    <option>Class 3</option>
    <option>Class 4</option>
    <option>Class 5</option>
    <option>Class 6</option>
    <option>Class 7</option>
    <option>Class 8</option>
    <option>Class 9</option>
    <option>Class 10</option>
  </select>

  <label>Roll Number</label>
  <input type="number" id="roll" placeholder="Enter Roll Number">

  <button onclick="checkResult()">VIEW RESULT</button>

  <div class="result" id="result">
    <h2>Student Result</h2>

    <p><b>Name:</b> <span id="studentName"></span></p>
    <p><b>Class:</b> <span id="studentClass"></span></p>
    <p><b>Roll No:</b> <span id="studentRoll"></span></p>

    <table>
      <tr>
        <th>Subject</th>
        <th>Marks</th>
      </tr>
      <tr><td>Hindi</td><td id="hindi"></td></tr>
      <tr><td>English</td><td id="english"></td></tr>
      <tr><td>Mathematics</td><td id="math"></td></tr>
      <tr><td>Science</td><td id="science"></td></tr>
      <tr><td>Social Science</td><td id="sst"></td></tr>
    </table>

    <div class="total">
      <b>Total:</b> <span id="total"></span>/500<br>
      <b>Percentage:</b> <span id="percentage"></span>%<br>
      <b>Result:</b> <span id="status"></span>
    </div>
  </div>

</div>

<div class="footer">
  © 2026 Brilliant Public School
</div>

<script>

const students = {

  "1-1": {
    name:"Demo Student",
    hindi:80,
    english:75,
    math:85,
    science:78,
    sst:82
  }

};

function checkResult(){

  const cls = document.getElementById("class").value;
  const roll = document.getElementById("roll").value;

  if(!cls || !roll){
    alert("Please select class and enter roll number.");
    return;
  }

  const classNumber = cls.replace("Class ","");
  const student = students[classNumber + "-" + roll];

  if(!student){
    alert("Result not found. Please check Class and Roll Number.");
    document.getElementById("result").style.display="none";
    return;
  }

  const total =
    student.hindi +
    student.english +
    student.math +
    student.science +
    student.sst;

  const percentage = (total / 500 * 100).toFixed(2);

  document.getElementById("studentName").textContent=student.name;
  document.getElementById("studentClass").textContent=cls;
  document.getElementById("studentRoll").textContent=roll;

  document.getElementById("hindi").textContent=student.hindi;
  document.getElementById("english").textContent=student.english;
  document.getElementById("math").textContent=student.math;
  document.getElementById("science").textContent=student.science;
  document.getElementById("sst").textContent=student.sst;

  document.getElementById("total").textContent=total;
  document.getElementById("percentage").textContent=percentage;
  document.getElementById("status").textContent="PASS";

  document.getElementById("result").style.display="block";
}

</script>

</body>
</html>
